# ===================================================================
# Student Profile and Skill Development Management System Configuration
# ===================================================================

# Application Identity & Server Configuration
spring.application.name=Student-Skill-Management
server.port=8080

# Database Configuration (MySQL)
# Default connects to 'student_skill_db' on localhost:3306
# Credentials can be overridden using environment variables DB_USERNAME and DB_PASSWORD
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:student_skill_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Hamdan@12}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Spring Data JPA & Hibernate Configuration
# Automatically creates and updates database schema matching JPA entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
